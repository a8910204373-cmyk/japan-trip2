function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var WX={};
function wc(c){return c==0?"☀️ 晴":c<4?"⛅ 多雲":c<50?"🌫️ 霧":c<70?"🌧️ 雨":c<80?"❄️ 雪":c<90?"🌦️ 陣雨":"⛈️ 雷雨"}
function pc(x,u){return x==null?"—":x+u}
function getWx(k){
  var d=D[k].d,l=LOC[d],md=d.replace("/","-");
  if(WX[d])return Promise.resolve(WX[d]);
  var b="&latitude="+l[0]+"&longitude="+l[1]+"&timezone=Asia%2FTokyo&daily=weather_code,temperature_2m_max,temperature_2m_min,";
  var f="https://api.open-meteo.com/v1/forecast?start_date=2026-"+md+"&end_date=2026-"+md+b+"precipitation_probability_max";
  var a="https://archive-api.open-meteo.com/v1/archive?start_date=2025-"+md+"&end_date=2025-"+md+b+"precipitation_sum";
  return fetch(f).then(function(r){return r.json()}).then(function(j){
    if(j.daily&&j.daily.temperature_2m_max&&j.daily.temperature_2m_max[0]!=null)return{j:j.daily,p:"降雨機率 "+pc(j.daily.precipitation_probability_max[0],"%"),t:"預報"};
    throw 0;
  }).catch(function(){
    return fetch(a).then(function(r){return r.json()}).then(function(j){return{j:j.daily,p:"降雨量 "+pc(j.daily.precipitation_sum[0]," mm"),t:"去年同日參考（尚無預報）"}});
  }).then(function(w){WX[d]=w;return w});
}
function trip(k){

  var x=D[k],h=x.h.split("|"),L=LOC[x.d];

  html+='<div class=box id=wx>⏳ 載入'+L[2]+'天氣…</div>';
  x.i.forEach(function(s){
    var p=s.split("|"),n=esc(p[1]);
    if(p[1].indexOf("→")<0&&p[0]!=="💡"&&p[0]!=="❗")n='<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[1])+'">'+n+"</a>";
    html+='<div class="it'+(s.indexOf("❗")>-1?" warn":"")+'"><div class=ic>'+p[0]+"</div><div><div class=nm>"+n+"</div><div class=nt>"+esc(p[2]||"")+"</div></div></div>";
  });
  html+='<div class=box><b>📍 附近還能逛</b><div class=nt>'+esc(NEAR[x.d])+"</div></div>";
  html+='<div class=hotel>🏠 '+esc(h[0])+(h[1]?" · "+esc(h[1]):"")+"</div>";
  main.innerHTML=html;window.scrollTo(0,0);
  getWx(k).then(function(w){var el=document.getElementById("wx");if(!el||D[k]!==x||!el.isConnected)return;var j=w.j;
    el.innerHTML="<b>"+L[2]+"天氣</b> "+wc(j.weather_code[0])+" · "+Math.round(j.temperature_2m_min[0])+"–"+Math.round(j.temperature_2m_max[0])+"°C · "+w.p+'<div class=nt>資料：Open-Meteo（'+w.t+"）</div>"})
  .catch(function(){var el=document.getElementById("wx");if(el)el.textContent="天氣暫時無法載入，請稍後重試"});
}
var S={};try{S=JSON.parse(localStorage.getItem("pk")||"{}")}catch(e){}
function pack(){
  var html="<h2>🧳 自駕必帶物品</h2><div class=sub>勾選會存在這台裝置的瀏覽器中</div>";
  PACK.forEach(function(g,i){
    html+="<div class=box><b>"+g[0]+"</b>";
    g[1].forEach(function(t,j){var id="c"+i+"_"+j;html+='<label class=ck><input type=checkbox data-k="'+id+'"'+(S[id]?" checked":"")+"> <span>"+esc(t)+"</span></label>"});
    html+="</div>";
  });
  html+='<div class=box><b>🚦 自駕提醒</b><ul>'+DRIVE.map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+"</ul></div>";
  main.innerHTML=html;window.scrollTo(0,0);
  [].forEach.call(main.querySelectorAll("input"),function(c){c.onchange=function(){S[c.dataset.k]=c.checked;try{localStorage.setItem("pk",JSON.stringify(S))}catch(e){}}});
}
function tax(){
  var html="<h2>💴 日本退稅步驟</h2><div class=sub>2026年11月1日起改為「先付含稅價、出境時辦理退稅」的新制</div>";
  TAX.forEach(function(t,i){html+='<div class=it><div class=ic>'+(i+1)+"</div><div><div class=nm>"+esc(t[0])+"</div><div class=nt>"+esc(t[1])+"</div></div></div>"});
  html+='<div class=box>官方資訊：<a target="_blank" rel="noopener" href="https://www.narita-airport.jp/en/news/refund/">成田機場退稅說明</a>　<a target="_blank" rel="noopener" href="https://www.vjw.digital.go.jp/">Visit Japan Web</a><div class=nt>規定可能調整，出發前請再確認。</div></div>';
  main.innerHTML=html;window.scrollTo(0,0);
}
[["trip","🗓️ 行程"],["pack","🧳 行李"],["tax","💴 退稅"]].forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.dataset.v=t[0];b.onclick=function(){location.hash=t[0]==="trip"?"d1":t[0]};tabs.appendChild(b)});
D.forEach(function(x,k){var b=document.createElement("button");b.textContent=x.d;b.onclick=function(){location.hash="d"+(k+1)};nav.appendChild(b)});
function route(){
  var h=location.hash,m=/^#d(\d+)$/.exec(h),v=h==="#pack"?"pack":h==="#tax"?"tax":"trip";
  [].forEach.call(tabs.children,function(b){b.className=b.dataset.v===v?"on":""});
  nav.style.display=v==="trip"?"flex":"none";
  if(v==="pack")pack();else if(v==="tax")tax();else trip(m?Math.min(Math.max(+m[1]-1,0),D.length-1):0);
}
window.addEventListener("hashchange",route);route();
</script>
